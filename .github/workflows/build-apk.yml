name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build the app
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LiveTranscriber.apk

      - name: Save APK as a build file
        uses: actions/upload-artifact@v4
        with:
          name: LiveTranscriber-apk
          path: LiveTranscriber.apk

      - name: Publish APK to the "latest" release (easy phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest LiveTranscriber.apk \
            --title "Live Transcriber (latest build)" \
            --notes "Download LiveTranscriber.apk on your Android phone and open it to install."
