plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jacob.livetranscriber'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jacob.livetranscriber'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
