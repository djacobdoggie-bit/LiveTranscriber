plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.jacob.livetranscriber'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jacob.livetranscriber'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '2.0-whisper'
        ndk {
            // Modern phones (incl. Galaxy S23) are 64-bit ARM
            abiFilters 'arm64-v8a'
        }
    }

    // Fixed signing key so new builds install as updates over old ones
    signingConfigs {
        shared {
            storeFile file('livetranscriber.keystore')
            storePassword 'livetranscriber'
            keyAlias 'livetranscriber'
            keyPassword 'livetranscriber'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    // Keep the speech models uncompressed so they load fast
    androidResources {
        noCompress 'onnx', 'txt'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
